name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd lalapan_mobile
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build iOS Application (No Codesign)
        run: |
          cd lalapan_mobile
          flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          cd lalapan_mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Lalapan_iOS_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lalapan-iOS-IPA
          path: lalapan_mobile/build/ios/iphoneos/Lalapan_iOS_unsigned.ipa
          retention-days: 7
